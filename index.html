<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprenda a Desenhar Passo a Passo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Como Desenhar um Personagem</h1>
        <p>Siga o passo a passo abaixo para criar seu desenho do zero!</p>
    </header>

    <main class="container">
        <section class="passo">
            <h2>Passo 1: Esboço Inicial</h2>
            <p>Comece desenhando formas geométricas simples para definir a pose.</p>
            <img src="https://via.placeholder.com/300x200" alt="Passo 1 do desenho">
        </section>

        <section class="passo">
            <h2>Passo 2: Detalhes e Linhas</h2>
            <p>Agora refine o contorno e adicione os detalhes dos olhos e roupas.</p>
            <img src="https://via.placeholder.com/300x200" alt="Passo 2 do desenho">
        </section>

        <button id="btn-concluir">Marcar como Concluído!</button>
        <p id="mensagem-status"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
